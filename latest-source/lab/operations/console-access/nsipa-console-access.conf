server { listen 127.0.0.1:18084; listen 443 ssl; ssl_certificate /opt/openg2p-lab/tls/server.crt; ssl_certificate_key /opt/openg2p-lab/tls/server.key; server_name kafka.nigeriag2p.com; return 302 https://g2p-kafka.wverve.in$request_uri; }
